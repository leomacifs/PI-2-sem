<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devolução</title>
  <link rel="stylesheet" href="Devolucao_Livro.css">
</head>
<body>

 <header>
  <a href="Página_Inicial_T.html" class="logo-link">
    <img src="imagemlogo.png" alt="Logo PUC" class="header-logo">
  </a>
  
  <div class="header-text">
    <h1>Biblioteca Universitária</h1>
    <h2>Autoatendimento</h2>
  </div>
</header>

  <main class="container">
    <div class="card">
      <h2>Devolução de livro</h2>
      
      <form action="#" method="post">
        <p>Insira seu RA:</p>
        <input type="text" name="ra" placeholder="Digite seu RA" required>

        <p>Insira o livro a ser devolvido:</p>
        <input type="text" name="codigo_livro" placeholder="Digite o código do livro" required>

        <button type="submit" class="btn-primary">Devolver</button>
        
        <a href="Página_Inicial_T.html" class="btn">Voltar</a>
      </form>
    </div>
  </main>
  <script src="/backend/js/totem.js"></script>
</body>
</html>

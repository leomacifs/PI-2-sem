<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Aluno</title>
  <link rel="stylesheet" href="Cadastrar.css">
</head>
<body>

  <header>
  <a href="Página_Inicial_A.html" class="logo-link">
    <img src="imagemlogo.png" alt="Logo PUC" class="header-logo">
  </a>
  
  <div class="header-text">
    <h1>Biblioteca Universitária</h1>
    <h2>Área do aluno</h2>
  </div>
</header>
  <script>
    function handleSubmit(event) {
     
      event.preventDefault(); // Impede o envio padrão do formulário
     
      const form = event.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      fetch(form.action, {
        method: form.method,
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(result => {
       window.location.href = "Cadastro_Aluno_Confirmado.html";
        form.reset(); // Limpa o formulário após o envio bem-sucedido
      })
      .catch(error => {
        console.error('Erro ao realizar o cadastro:', error);
        alert('Ocorreu um erro ao realizar o cadastro. Por favor, tente novamente.');
      });
    }
  </script>
  <main>
    <div class="card">
      <h2>Cadastrar</h2>
      <p>Preencha todos os campos abaixo para realizar seu cadastro:</p>

      <form>
        <label for="ra">RA:</label>
        <input type="text" id="ra" name="ra" required>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="text" id="Email" name="email" required> <label for="tel">Telefone:</label>
        <input type="text" id="tel" name="telefone" required> <button type="submit" class="btn">Confirmar Cadastro</button>
        <a href="Página_Inicial_A.html" class="btn voltar">Voltar</a>
      </form>
    </div>
  </main>
  <script src="/backend/js/aluno.js"></script>
</body>
</html>

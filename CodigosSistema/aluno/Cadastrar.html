<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Aluno</title>
  <link rel="stylesheet" href="Cadastrar.css">
</head>
<body>

  <header>
    <a href="Página_Inicial_A.html" class="logo-link">
      <img src="imagemlogo.png" alt="Logo PUC" class="header-logo">
    </a>
    
    <div class="header-text">
      <h1>Biblioteca Universitária</h1>
      <h2>Área do aluno</h2>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Cadastrar</h2>
      <p>Preencha todos os campos abaixo para realizar seu cadastro:</p>

      <form>
        <label for="ra">RA:</label>
        <input type="text" id="ra" name="ra" required>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required> 

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" required> 

        <button type="submit" class="btn">Confirmar Cadastro</button>
        <a href="Página_Inicial_A.html" class="btn voltar">Voltar</a>
      </form>
    </div>
</main>
  </div>
  
  <script src="../backend/js/aluno.js"></script>
</body>
</html>

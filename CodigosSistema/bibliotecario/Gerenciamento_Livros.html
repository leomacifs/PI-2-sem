<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Livros - Biblioteca Universitária</title>
    <link rel="stylesheet" href="Gerenciamento_Livros.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Biblioteca Universitária</h1>
             <img src="imagemlogo.png" alt="Logo Biblioteca Universitária" class="logo">
        </header>
        
        <main class="content">
            <h2>Gerenciamento de Livros</h2>
            
            <div class="options-grid">
                <div class="option-card">
                    <div class="card-icon">📚</div>
                    <h3>Todos os Livros</h3>
                    <p>Visualize e gerencie todo o acervo da biblioteca</p>
                    <button class="action-btn">Acessar</button>
                </div>
                
                <div class="option-card">
                    <div class="card-icon">📖</div>
                    <h3>Livros Emprestados</h3>
                    <p>Consulte livros atualmente emprestados e seus prazos</p>
                    <button class="action-btn">Acessar</button>
                </div>
                
                <div class="option-card">
                    <div class="card-icon">📊</div>
                    <h3>Relatório Completo</h3>
                    <p>Gere relatórios detalhados sobre o acervo e empréstimos</p>
                    <button class="action-btn">Acessar</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

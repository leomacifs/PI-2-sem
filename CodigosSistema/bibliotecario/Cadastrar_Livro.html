<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa do Bibliotecário</title>
    <link rel="stylesheet" href="Cadastrar_Livro.css"> 
</head>
<body>
    <header>
        <h1>Sistema de Gestão de Biblioteca Universitária</h1>
        <img src="imagemlogo.png" alt="Logo Biblioteca" width="100">
    </header>
    <main>
        <section>
            <h2>Cadastro de Livros</h2>
            <form id="formLivro">
                <label for="livro">Título do Livro:</label>
                <input type="text" id="livro" required>

                <label for="autor">Autor:</label>
                <input type="text" id="autor" required>

                <label for="qtd">ISBN:</label>
                <input type="number" id="qtd" min="1" required>

                <label for="genero">Categoria:</label>
                <input type="text" id="genero">

                <button type="submit">Confirmar Cadastro</button>
            </form>
            
            <!-- ADICIONE ESTE BOTÃO PARA TESTE -->
            <button onclick="testarFuncoes()" style="background-color: orange; margin-top: 10px;">
                TESTAR JAVASCRIPT
            </button>
        </section>
    </main>
    
    <script src="/js/bibliotecario.js"></script>
    
    <!-- ADICIONE ESTE SCRIPT DE TESTE -->
    <script>
        function testarFuncoes() {
            console.log('🎯 Botão de teste clicado!');
            alert('JavaScript está funcionando!');
            
            // Testar se a função cadastrarLivro existe
            if (typeof cadastrarLivro === 'function') {
                console.log('✅ Função cadastrarLivro existe');
            } else {
                console.log('❌ Função cadastrarLivro NÃO existe');
            }
        }
        
        // Verificar se o script carregou
        console.log('📄 Página Cadastrar_Livro carregada');
        console.log('🔗 URL do script:', document.currentScript.src);
    </script>
</body>
</html>

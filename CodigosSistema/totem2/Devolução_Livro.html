<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totem</title>
  <link rel="stylesheet" href="Devolução_Livro.css">
</head>
<body>
<header>
  <h1>Sistema de Biblioteca - Autoatendimento</h1>
  <img src="imagemlogo.png" alt="Logo Biblioteca" width="100">
</header>
<main>
  <div class="card" role="region" aria-labelledby="card-title">
    <h2 id="card-title">Devolução de Livro</h2>
    <p class="subtitle">Escolha uma das opções abaixo para iniciar o processo.</p>
    
    <form>
      <div class="form-group">
        <label for="ra">RA:</label>
        <input type="text" id="ra" name="ra" placeholder="Digite o RA">
      </div>
      
      <div class="form-group">
        <label for="livro">Nome/Código do livro:</label>
        <input type="text" id="livro" name="livro" placeholder="Digite nome ou código do livro">
      </div>
      
      <div class="actions" role="navigation">
        <button class="btn" id="btn-retirada">Confirmar devolução</button>
      </div>
    </form>
    
    <p class="hint">Toque em uma opção para prosseguir. O sistema abrirá a tela correspondente.</p>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Livros</title>
  <link rel="stylesheet" href="Cadastrar_Livro.css">
</head>
<body>

  <header>
  <a href="Cadastrar_Livro.html" class="logo-link">
    <img src="imagemlogo.png" alt="Logo PUC" class="header-logo">
  </a>
  
  <div class="header-text">
    <h1>Biblioteca Universitária</h1>
    <h2>Área do aluno</h2>
  </div>
</header>
  <script>
    function handleSubmit(event) {
     
      event.preventDefault(); // Impede o envio padrão do formulário
     
      const form = event.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      fetch(form.action, {
        method: form.method,
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(result => {
        alert('Livro cadastrado com sucesso!');
        form.reset(); // Limpa o formulário após o envio bem-sucedido
      })
      .catch(error => {
        console.error('Erro ao cadastrar o livro:', error);
        alert('Ocorreu um erro ao cadastrar o livro. Por favor, tente novamente.');
      });
    }

  </script>
 
  <main>
    <div class="card">
      <h2>Cadastrar livro</h2>
      <p>Preencha todos os campos abaixo para realizar o cadastro do livro:</p>

      <form action="http://localhost:3001/api/bibliotecario/cadastrar-livro" method="post" onsubmit={handleSubmit(event)} >
        <label for="titulo">Título do Livro:</label>
        <input type="text" id="titulo" name="titulo" required>

        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" required>

        <label for="codigo">Código:</label>
        <input type="text" id="codigo" name="codigo" required>

        <label for="">Categoria:</label>
        <input type="text" id="categoria" name="categoria" required>

        <button type="submit" class="btn">Confirmar Cadastro</button>
        <button type="button" class="voltar" onclick="window.location.href='../1 - Pagina_Inicial/Pagina_inicial.html'">Voltar</button>
      </form>
    </div>
  </main>
  <script src="/js/bibliotecario.js"></script>
</body>
</html>
